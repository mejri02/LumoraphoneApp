<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08080a">
<title>Lumora</title>
<link rel="stylesheet" href="css/app.css">
<style id="splash-css">
html,body{background:#000}
#splash{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .55s ease,transform .55s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .lg{width:112px;height:112px;opacity:0;transform:scale(.6);animation:spIn .9s cubic-bezier(.2,.9,.3,1.15) .1s forwards;filter:drop-shadow(0 0 28px rgba(229,23,63,.45))}
#splash .nm{margin-top:26px;font:700 34px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:6px;color:#fff;opacity:0;transform:translateY(12px);animation:spUp .7s ease .55s forwards}
#splash .bar{position:absolute;bottom:calc(9vh + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:3px;background:#ffffff1f;overflow:hidden;opacity:0;animation:spFade .4s ease 1s forwards}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:#e5173f;animation:spBar 1.1s ease-in-out infinite}
@keyframes spIn{to{opacity:1;transform:scale(1)}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
</style>
</head>
<body>
<div id="splash">
    <svg class="lg" viewBox="0 0 64 64"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a4133c"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#sg)"/><ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(-28 32 32)" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4"/><path d="M26 21 L45 32 L26 43 Z" fill="#fff"/></svg>
    <div class="nm">LUMORA</div>
    <div class="bar"><i></i></div>
</div>
<div id="app">
    <header id="top">
        <button class="brand" data-act="tab" data-v="home" aria-label="Lumora">
            <svg class="mark" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a4133c"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(-28 32 32)" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4"/><path d="M26 21 L45 32 L26 43 Z" fill="#fff"/></svg>
        </button>
        <div class="tools" id="tools"></div>
    </header>
    <main id="main"></main>
    <div id="mini" class="hidden"></div>
    <nav id="nav"></nav>
</div>

<div id="pl" class="hidden">
    <div id="pl-stage">
        <video id="html-video" playsinline></video>
        <div id="pl-ui">
            <div class="pl-top">
                <button class="pl-ic" data-act="pl-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
                <button class="pl-ic pl-unlock" data-act="pl-unlock" aria-label="Unlock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
            </div>
            <div class="pl-mid">
                <button id="pl-pp" class="pl-pp" data-act="pl-pp" aria-label="Play/Pause"></button>
                <div id="pl-spin" class="spin hidden"></div>
                <div id="pl-err" class="pl-err hidden"></div>
            </div>
            <div class="pl-bot">
                <div id="pl-seek" class="hidden"><button class="pl-ic sm" data-act="pl-back10">&#8634;10</button><span id="pl-pos">0:00</span><input id="pl-range" type="range" min="0" max="1000" value="0"><span id="pl-dur">0:00</span><button class="pl-ic sm" data-act="pl-fwd10">10&#8635;</button></div>
                <div class="pl-row"><span id="pl-time" class="pl-time">00:00:00</span><span class="sp"></span>
                    <button class="pl-ic" data-act="pl-pip" aria-label="PiP"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg></button>
                    <button class="pl-ic" data-act="pl-fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
                </div>
            </div>
        </div>
    </div>
    <div id="pl-info">
        <div class="pl-pill" id="pl-group"></div>
        <div class="pl-title"><img id="pl-logo" alt="" onerror="this.style.display='none'"><h2 id="pl-name"></h2></div>
        <div class="pl-actions">
            <button id="pl-fav" data-act="pl-fav" aria-label="Favorite"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg></button>
            <button id="pl-cast" data-act="pl-cast" aria-label="Cast"><svg viewBox="0 0 24 24"><path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 12a9 9 0 0 1 8 8M2 16a5 5 0 0 1 4 4"/></svg></button>
            <button id="pl-lock" data-act="pl-lock" aria-label="Lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
        </div>
        <div id="pl-sched"><h3 id="pl-sched-t">Schedule</h3><div id="pl-epg"></div></div>
    </div>
</div>

<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="js/core/config.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/net.js"></script>
<script src="js/core/m3u.js"></script>
<script src="js/core/xtream.js"></script>
<script src="js/core/stalker.js"></script>
<script src="js/core/player.js"></script>
<script src="js/pair.js"></script>
<script src="js/app.js"></script>
</body>
</html>
