<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lumora</title>
<style>
:root{--bg:#09090b;--bar:#0e0e12;--card:#16161b;--card2:#202027;--tx:#f5f5f7;--mut:#8e8e99;--acc:#e5173f;--ok:#22c55e;--bad:#ff5b6e;--line:#26262d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit;border:0;background:none}
input,select{background:var(--card);border-radius:12px;padding:12px 14px;width:100%;outline:none;border:1px solid var(--line)}
input:focus,select:focus{border-color:var(--acc)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hid{display:none!important}
#root{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff4d6d,#a4133c);display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.ib:active{background:var(--card)}
h1{font-size:28px;margin:12px 16px 14px;font-weight:800}
main{flex:1;overflow-y:auto;padding:0 16px 110px;-webkit-overflow-scrolling:touch}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;background:var(--bar);border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);min-width:62px}
.nb .pill{padding:6px 18px;border-radius:16px;display:grid;place-items:center}
.nb.on{color:var(--tx)}
.nb.on .pill{background:var(--card2)}
.plus{width:58px;height:58px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;margin-bottom:6px}
.plus.on{border-color:var(--acc);color:var(--acc)}
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--card2);color:var(--tx)}
.seg button.on.acc{color:var(--acc)}
.fld{margin-bottom:14px}
.grp{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:start}
.grp .gi{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--mut);flex:0 0 42px}
.gt{display:flex;flex-direction:column;gap:3px;min-width:0}
.gt b{font-weight:600}
.gt small,.muted{color:var(--mut);font-size:13px}
.back{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.hs .it{flex:0 0 124px}
.it{min-width:0}
.th{position:relative;width:100%;aspect-ratio:2/3;border-radius:14px;background:var(--card2);overflow:hidden;display:grid;place-items:center}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ph{color:var(--mut);opacity:.6}
.ph svg{width:30px;height:30px}
.row2{display:flex;align-items:center;gap:4px;margin-top:6px}
.nm{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv{width:30px;height:30px;display:grid;place-items:center;color:var(--mut);flex:0 0 30px}
.fv.on{color:var(--acc)}
.fv.on svg{fill:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.kc{background:var(--card);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kc svg{width:28px;height:28px;color:var(--acc)}
.kc small{color:var(--mut)}
.hero{background:linear-gradient(135deg,#2a0c14,#16161b);border-radius:18px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:4px}
h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.sec{background:var(--card);border-radius:18px;padding:6px 16px;margin-bottom:14px}
.sec h3{margin:12px 0 6px;font-size:15px;color:var(--mut);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
.kv span{color:var(--mut)}
.kv b{font-weight:600;text-align:end;word-break:break-all;direction:ltr}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow select{width:auto;padding:8px 10px}
.sw{display:flex;gap:10px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:var(--tx)}
.acc-r{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.acc-r:last-child{border:0}
.acc-r>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-r small{color:var(--mut);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;background:var(--acc);color:#fff;border-radius:8px;padding:2px 7px;align-self:flex-start}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.6}
.btn2{padding:10px 14px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px}
.btn2.danger{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn2{flex:1;text-align:center}
form.lf{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.pw{position:relative;display:block}
.pw input{padding-inline-end:70px}
.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;padding:6px 8px}
.err{background:#2a1015;border:1px solid #5a1e2a;border-radius:16px;padding:14px;margin-bottom:14px}
.eh{display:flex;align-items:center;gap:8px;color:var(--bad)}
.eh svg{width:20px;height:20px}
.err p{margin:8px 0 6px;font-size:15px}
.err small{color:var(--mut);font-size:13px;line-height:1.6}
.warn{display:flex;gap:8px;align-items:center;background:#2a2410;border:1px solid #5a4a1e;color:#fbbf24;border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px}
.warn svg{width:20px;height:20px;flex:0 0 20px}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--mut);text-align:center}
.empty svg{width:44px;height:44px;opacity:.6}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--acc);margin:40px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:40}
.panel{position:relative;width:100%;max-height:80vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sx{position:absolute;top:10px;inset-inline-end:10px}
.sh-h{font-size:17px;margin:4px 40px 14px 0}
.sn{color:var(--mut);margin:14px 0 6px;font-weight:600}
.ep{display:block;width:100%;text-align:start;padding:12px;border-radius:12px;background:var(--card2);margin-bottom:6px}
.player{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;color:#fff}
.ptop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vid{flex:1;width:100%;min-height:0;background:#000}
.toast{position:fixed;bottom:100px;inset-inline:50%;transform:translateX(50%);background:#2a2a31;padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.bad{background:#4a1520}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5);z-index:2}
.bar i{display:block;height:100%;background:var(--acc)}
.spdbar{display:flex;gap:6px;justify-content:center;padding:8px;background:#000}
.spdbar button{padding:6px 12px;border-radius:10px;background:var(--card2);color:#fff;font-size:13px}
.spdbar button.on{background:var(--acc)}
.epg{color:#fff;font-size:14px;padding:6px 14px;background:#000;line-height:1.5;min-height:0}
.epg:empty{display:none}
</style>
</head>
<body>
<div id="root">
  <header class="top">
    <div class="logo">LM</div>
    <div class="sp"></div>
    <button class="ib" data-a="tab" data-v="settings" data-ic="gear" aria-label="Settings"></button>
  </header>
  <main id="main"></main>

</div>

<div id="player" class="player hid">

  <video id="vid" controls playsinline></video>
  <div class="spdbar"><button data-a="speed" data-v="0.5">0.5x</button><button data-a="speed" data-v="1">1x</button><button data-a="speed" data-v="1.25">1.25x</button><button data-a="speed" data-v="1.5">1.5x</button><button data-a="speed" data-v="2">2x</button></div>
</div>
<div id="sheet" class="sheet hid"><div class="panel"><button class="ib sx" data-a="close" data-ic="x" aria-label="Close"></button><div id="sheet-in"></div></div></div>
<input type="file" id="imp" accept="application/json" class="hid">

class LErr extends Error{constructor(code,p){super(code);this.code=code;this.p=p||{}}}
async function fetchOnce(url,ms){
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms||15000);
 let txt;
 try{
  const r=await fetch(url,{signal:c.signal,cache:'no-store'});
  if(!r.ok) throw new LErr('E_HTTP',{c:r.status});
  txt=await r.text();
 }catch(e){
  if(e instanceof LErr) throw e;
  throw new LErr(e.name==='AbortError'?'E_TIMEOUT':'E_NET');
 }finally{clearTimeout(timer)}
 try{return JSON.parse(txt)}catch(e){throw new LErr('E_FORMAT')}
}
async function fetchJ(url,ms){
 let last;
 for(let i=0;i<3;i++){
  try{return await fetchOnce(url,ms)}
  catch(e){
   last=e;
   if(!(e instanceof LErr)||!(e.code==='E_NET'||e.code==='E_TIMEOUT'||(e.code==='E_HTTP'&&e.p.c>=500))) throw e;
   await new Promise(r=>setTimeout(r,800*(i+1)));
  }
 }
 throw last;
}
function normServer(s){
 s=String(s||'').trim().replace(/[?#].*$/,'').replace(/\/(player_api|get|panel_api)\.php$/i,'').replace(/\/+$/,'');
 return /^https?:\/\/[a-z0-9\[\]:.-]+(:\d{1,5})?(\/\S*)?$/i.test(s)?s:null;
}
function apiUrl(a,action,extra){
 return a.server+'/player_api.php?username='+encodeURIComponent(a.user)+'&password='+encodeURIComponent(a.pass)+(action?'&action='+action:'')+(extra?'&'+extra:'');
}
async function login(a){
 const user=String(a.user||'').trim(),pass=String(a.pass||'').trim();
 if(!user||!pass) throw new LErr('E_EMPTY');

 return {server,user,pass,info:{status:u.status||'',exp:exp>0?exp:0,max:parseInt(u.max_connections,10)||0,active:parseInt(u.active_cons,10)||0,checked:Date.now()}};

     if(!d.fatal) return;

  case 'more': S.page++;render();break;
  case 'open': openItem(ITEM[b.dataset.k]);break;
  case 'fav': toggleFav(ITEM[b.dataset.k]);break;
  case 'fk': S.fk=v;render();break;
  case 'play': closeSheet();play(b.dataset.u,b.dataset.t,{key:b.dataset.u,title:b.dataset.t,kind:'ep',url:b.dataset.u});break;
  case 'closePlayer': closePlayer();break;
  case 'close': closeSheet();break;
  case 'pw': S.showPw=!S.showPw;render();break;
  case 'refresh': S.cache={};S.pending={};S.err=null;render();if(acc()) verifyCurrent(false);break;
  case 'test': verifyCurrent(true);break;
  case 'edit': {const x=S.accounts.find(z=>z.id===v);if(!x)break;S.form={server:x.server,user:x.user,pass:x.pass,name:x.name};S.editId=v;S.err=null;S.tab='add';render();break}
  case 'switch': S.curId=v;S.cache={};S.pending={};S.group=null;S.banner=null;S.err=null;S.tab='home';persist();render();verifyCurrent(false);break;
  case 'delacc': if(confirm(t('confirmDel'))){S.accounts=S.accounts.filter(x=>x.id!==v);if(S.curId===v) S.curId=S.accounts[0]?S.accounts[0].id:null;S.cache={};S.pending={};persist();render()}break;
  case 'logout': S.curId=null;S.cache={};S.pending={};S.banner=null;S.err=null;S.tab='add';persist();render();break;
  case 'clearfav': S.favs=S.favs.filter(f=>f.acc!==S.curId);persist();render();break;
  case 'reset': if(confirm(t('confirmReset'))){try{localStorage.clear()}catch(x){}location.reload()}break;
  case 'cw': {const p=S.pos[b.dataset.k];if(p) play(p.url,p.title,{key:p.key,title:p.title,kind:p.kind,icon:p.icon,url:p.url});break}
  case 'speed': S.settings.speed=+v;$('#vid').playbackRate=+v;persist();document.querySelectorAll('.spdbar button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));break;
  case 'export': exportBackup();break;
  case 'import': $('#imp')?.click();break;
  case 'setpin': {const p=prompt(AR()?'رمز من 4 أرقام، اتركه فارغاً لإلغاء القفل':'4-digit PIN, leave empty to disable');if(p===null) break;if(p!==''&&!/^\d{4}$/.test(p)){toast(AR()?'يجب أن يكون 4 أرقام':'Must be 4 digits',1);break}S.settings.pin=p;S.unlocked=false;persist();toast(t('ok'));render();break}
  case 'pip': {const v=$('#vid');if(document.pictureInPictureElement) document.exitPictureInPicture();else if(v.requestPictureInPicture) v.requestPictureInPicture().catch(()=>toast(AR()?'PiP غير مدعوم':'PiP not supported',1));break}
  case 'fs': {const el=$('#player');if(document.fullscreenElement) document.exitFullscreen();else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});break}
  case 'sleep': {sleepIdx=(sleepIdx+1)%SLEEP.length;clearTimeout(sleepT);const m=SLEEP[sleepIdx];
    if(m){sleepT=setTimeout(()=>{closePlayer();toast(AR()?'تم إيقاف المشغل تلقائياً':'Player stopped by sleep timer')},m*60000);toast((AR()?'إيقاف تلقائي بعد ':'Sleep in ')+m+(AR()?' دقيقة':' min'))}
    else toast(AR()?'تم إلغاء المؤقت':'Sleep timer off');break}
  case 'swatch': S.settings.accent=v;persist();render();break;
 }
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.form&&el.form.id==='lf'){S.form[el.name]=el.value;return}
 if(el.id==='gf'){
  S.gq=el.value;const q=el.value.trim().toLowerCase();
  document.querySelectorAll('#glist .grp').forEach(r=>r.classList.toggle('hid',!r.dataset.v.toLowerCase().includes(q)));
  return;
 }
 if(el.id==='sf') onSearch(el.value);
});
document.addEventListener('change',e=>{
 if(e.target.id==='imp'){importBackup(e.target.files[0]);return}
 const k=e.target.dataset.set;if(!k) return;
 S.settings[k]=e.target.value;persist();render();
});
document.addEventListener('submit',e=>{
 if(e.target.id==='lf'){e.preventDefault();if(!S.busy) doLogin()}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet') closeSheet()});

const vEl=$('#vid');
vEl.addEventListener('timeupdate',()=>{if(!curMeta) return;const n=Date.now();if(n-lastSave<5000) return;lastSave=n;savePos()});
vEl.addEventListener('loadedmetadata',()=>{
 vEl.playbackRate=S.settings.speed||1;
 if(!curMeta) return;
 const p=S.pos[curMeta.key];
 if(p&&S.settings.resume&&p.t>30&&(!p.d||p.t<p.d-30)) vEl.currentTime=p.t;
});
document.addEventListener('keydown',e=>{
 if($('#player').classList.contains('hid')) return;
 const v=$('#vid');
 if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause()}
 else if(e.key==='ArrowRight') v.currentTime+=10;
 else if(e.key==='ArrowLeft') v.currentTime-=10;
 else if(e.key==='Escape') closePlayer();
 else if(e.key==='m'||e.key==='M') v.muted=!v.muted;
 else if(e.key==='f'||e.key==='F') document.getElementById('player').requestFullscreen&&document.getElementById('player').requestFullscreen().catch(()=>{});
});
(function init(){
 if(acc()){
  S.tab=S.settings.start==='catalog'?'catalog':S.settings.start==='fav'?'fav':'home';
  render();verifyCurrent(false);
 }else{S.tab='add';render()}
})();
</script>
</body>
</html>
