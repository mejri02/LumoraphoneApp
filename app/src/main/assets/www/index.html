<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<title>Lumora</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
    <header id="top">
        <div class="brand"><svg class="mark" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(-28 32 32)" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4"/><path d="M26 21 L45 32 L26 43 Z" fill="#fff"/></svg><span id="title">Lumora</span></div>
        <button id="chip" class="chip" data-act="tab" data-v="remote"><i class="dot"></i><span id="chip-t"></span></button>
    </header>
    <main id="main"></main>
    <nav id="nav"></nav>
</div>

<div id="mini" class="hidden"></div>

<div id="pl" class="hidden">
    <video id="html-video" playsinline></video>
    <div id="pl-ui">
        <div class="pl-top">
            <button class="ib" data-act="pl-close" aria-label="Close">&#8592;</button>
            <div class="pl-name" id="pl-name"></div>
            <button class="ib" id="pl-cast" data-act="pl-cast" aria-label="Cast">&#128250;</button>
        </div>
        <div class="pl-mid">
            <div id="pl-spin" class="spin hidden"></div>
            <div id="pl-err" class="pl-err hidden"></div>
        </div>
        <div class="pl-bot">
            <div id="pl-seek" class="hidden"><span id="pl-pos">0:00</span><input id="pl-range" type="range" min="0" max="1000" value="0"><span id="pl-dur">0:00</span></div>
            <div class="pl-btns">
                <button class="ib" data-act="pl-back10">&#8634;10</button>
                <button class="ib big" id="pl-pp" data-act="pl-pp">&#10074;&#10074;</button>
                <button class="ib" data-act="pl-fwd10">10&#8635;</button>
                <button class="ib" data-act="pl-aspect" id="pl-asp">&#9635;</button>
            </div>
        </div>
    </div>
</div>

<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="js/core/config.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/net.js"></script>
<script src="js/core/m3u.js"></script>
<script src="js/core/xtream.js"></script>
<script src="js/core/stalker.js"></script>
<script src="js/core/player.js"></script>
<script src="js/pair.js"></script>
<script src="js/app.js"></script>
</body>
</html>
